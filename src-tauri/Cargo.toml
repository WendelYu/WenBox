[package]
name = "wenbox"
version = "1.4.6"
description = "WenBox - 局域网跨设备互传与多端百宝箱"
authors = ["Wendel"]
edition = "2021"
default-run = "wenbox"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "path-all", "clipboard-write-text", "clipboard-read-text", "fs-create-dir", "fs-exists", "fs-read-file", "fs-write-file"] }
arboard = "=3.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
uuid = { version = "1.6", features = ["v4"] }
local-ip-address = "0.5"
if-addrs = "=0.13.4"
socket2 = "=0.6.1"
hostname = "=0.4.2"
base64 = "0.21"
rust-embed = "8.2"
mime_guess = "2.0"
ureq = { version = "2.12", default-features = false, features = ["json"] }
url = "2.5"
dirs-next = "2.0"
tempfile = "=3.27.0"
rcgen = "=0.13.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Services", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "=0.2.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
