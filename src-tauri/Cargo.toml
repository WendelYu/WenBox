[package]
name = "wenbox"
version = "1.1.0"
description = "WenBox - 工控现场与工程师百宝箱"
authors = ["Wendel"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "fs-all", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
uuid = { version = "1.6", features = ["v4"] }
local-ip-address = "0.5"
base64 = "0.21"
rust-embed = "8.2"
mime_guess = "2.0"
ureq = { version = "2.12", default-features = false, features = ["json"] }
url = "2.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
