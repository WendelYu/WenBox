[package]
name = "wenbox"
version = "1.4.2"
description = "WenBox - 局域网跨设备互传与多端百宝箱"
authors = ["Wendel"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "path-all", "clipboard-write-text", "fs-create-dir", "fs-exists", "fs-read-file", "fs-write-file"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
uuid = { version = "1.6", features = ["v4"] }
local-ip-address = "0.5"
if-addrs = "=0.13.4"
socket2 = "=0.6.1"
hostname = "=0.4.2"
base64 = "0.21"
rust-embed = "8.2"
mime_guess = "2.0"
ureq = { version = "2.12", default-features = false, features = ["json"] }
url = "2.5"
dirs-next = "2.0"
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
