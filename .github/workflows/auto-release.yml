name: Auto Release on Push

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于生成更新日志

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Ensure gradlew exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Rename APK for Release
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | awk -F'"' '{print $2}')
          cp app/build/outputs/apk/debug/app-debug.apk WenBox-Android-v${VERSION}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          retention-days: 1
          path: WenBox-Android-*.apk

  build-windows:
    name: Build Windows EXE (Rust/Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify shared web runtime
        run: |
          node --check app/src/main/assets/web/app.js
          node --check app/src/main/assets/web/runtime.js
          npm test

      - name: Test desktop backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows EXE
        run: npx @tauri-apps/cli@1.5 build

      - name: Prepare Windows Files for Release
        shell: bash
        run: |
          VERSION=$(jq -r '.version' package.json)
          mkdir -p release-win
          cp src-tauri/target/release/wenbox.exe release-win/WenBox-Windows-v${VERSION}-x64.exe
          if ls src-tauri/target/release/bundle/nsis/*.exe 1> /dev/null 2>&1; then
            cp src-tauri/target/release/bundle/nsis/*.exe release-win/WenBox-Windows-v${VERSION}-Installer.exe
          fi
          if ls src-tauri/target/release/bundle/msi/*.msi 1> /dev/null 2>&1; then
            cp src-tauri/target/release/bundle/msi/*.msi release-win/WenBox-Windows-v${VERSION}-Installer.msi
          fi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          retention-days: 1
          path: release-win/*

  build-macos:
    uses: ./.github/workflows/release-macos.yml

  publish-release:
    name: Auto Publish to GitHub Release
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: release-assets

      - name: Get Version and Generate Tag
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Prepare Release Notes
        run: cp docs/RELEASE_NOTES.md release_notes.md

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: WenBox v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: release-assets/*
