name: Validate KVM Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: './src-tauri -> target'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test native pairing and shared logic
        run: |
          npm test
          cargo test --locked --manifest-path src-tauri/Cargo.toml --bin wenbox
      - name: Check privileged installer helper syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'src-tauri/installer/install-service.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; throw 'Installer helper parse failed' }
      - name: Build unified installer (includes input core and WenBox service)
        run: |
          npx --yes @tauri-apps/cli@1.5 build --bundles nsis 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify prepared resource integrity
        run: node scripts/prepare-kvm-backend.cjs --verify-only
      - name: Disposable runner install / upgrade / service boundary / uninstall smoke test
        shell: powershell
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          & ./scripts/check-kvm-installation.ps1 -Installer $installer.FullName
          $custom = Join-Path $env:ProgramFiles 'WenBox Custom Path'
          & ./scripts/check-kvm-installation.ps1 -Installer $installer.FullName -InstallDirectory $custom
      - name: Collect installer diagnostics
        if: always()
        shell: powershell
        run: |
          $log = Join-Path $env:TEMP 'WenBox-Kvm-Install.log'
          if (Test-Path -LiteralPath $log) { Copy-Item -LiteralPath $log -Destination . }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WenBox-KVM-M2-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/installer/install-service.ps1
            scripts/kvm-backend-lock.json
            WenBox-Kvm-Install.log
            windows-build.log
          if-no-files-found: error
          retention-days: 14
