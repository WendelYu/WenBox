name: Build WenBox Windows EXE (Rust / Tauri)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@1.5

      - name: Build Tauri Windows EXE
        run: cargo tauri build

      - name: Upload Windows EXE / Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WenBox-Windows-Rust-Exe
          path: |
            src-tauri/target/release/wenbox.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
