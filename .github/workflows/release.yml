name: Release WenBox (Android APK & Windows EXE & macOS DMG)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradlew exists
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WenBox-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: WenBox-Android.apk

  build-windows:
    name: Build Windows EXE (Rust/Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Tauri Windows EXE
        run: npx @tauri-apps/cli@1.5 build

      - name: Prepare Windows Files for Release
        shell: bash
        run: |
          mkdir -p release-win
          cp src-tauri/target/release/wenbox.exe release-win/WenBox-Windows-x64.exe
          if ls src-tauri/target/release/bundle/nsis/*.exe 1> /dev/null 2>&1; then
            cp src-tauri/target/release/bundle/nsis/*.exe release-win/WenBox-Windows-Installer.exe
          fi
          if ls src-tauri/target/release/bundle/msi/*.msi 1> /dev/null 2>&1; then
            cp src-tauri/target/release/bundle/msi/*.msi release-win/WenBox-Windows-Installer.msi
          fi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release-win/*

  build-macos:
    name: Build macOS DMG (Rust/Tauri, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (M 系列)
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-13          # Intel
            target: x86_64-apple-darwin
            arch: x64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Tauri macOS App
        run: npx @tauri-apps/cli@1.5 build -- --target ${{ matrix.target }}

      - name: Prepare macOS Files for Release
        run: |
          mkdir -p release-mac
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if ls "$BUNDLE_DIR"/dmg/*.dmg 1> /dev/null 2>&1; then
            cp "$BUNDLE_DIR"/dmg/*.dmg "release-mac/WenBox-macOS-${{ matrix.arch }}.dmg"
          fi
          if [ -d "$BUNDLE_DIR/macos/WenBox.app" ]; then
            cd "$BUNDLE_DIR/macos"
            zip -qry "$GITHUB_WORKSPACE/release-mac/WenBox-macOS-${{ matrix.arch }}.app.zip" WenBox.app
            cd "$GITHUB_WORKSPACE"
          fi
          ls -la release-mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: release-mac/*

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-assets

      - name: Download macOS Artifacts (aarch64)
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-aarch64
          path: release-assets

      - name: Download macOS Artifacts (x64)
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-x64
          path: release-assets

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
